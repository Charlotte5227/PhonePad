# CHANGELOG.md の一番上に新しいバージョン（## v1.2.3 ...）を書いて main に push すると、
# APK と PC用ソフトを組み立てて、そのバージョンとして公開する（公開済みのバージョンなら何もしない）
name: Release

on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: バージョン
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 -oP '^## v?\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if [ -z "$V" ]; then
            echo "::error::CHANGELOG.md に「## v1.2.3」の形のバージョンが見つかりません"
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "$V"
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V は公開済みなので何もしません"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.v.outputs.skip != '1'
        with:
          go-version: "1.24"

      - name: PC側のテスト
        if: steps.v.outputs.skip != '1'
        working-directory: pc
        run: go test ./...

      - name: PC側の組み立て
        if: steps.v.outputs.skip != '1'
        working-directory: pc
        run: |
          mkdir -p ../out
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.appVersion=${{ steps.v.outputs.ver }}" \
            -o ../out/PhonePad.exe .

      - uses: actions/setup-java@v5
        if: steps.v.outputs.skip != '1'
        with:
          distribution: temurin
          java-version: "17"

      - name: 署名の鍵
        if: steps.v.outputs.skip != '1'
        env:
          KS: ${{ secrets.PHONEPAD_KEYSTORE_BASE64 }}
          KP: ${{ secrets.PHONEPAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::GitHub の Repository secrets に PHONEPAD_KEYSTORE_BASE64 が見つかりません"
            exit 1
          fi
          if [ -z "$KP" ]; then
            echo "::error::GitHub の Repository secrets に PHONEPAD_KEYSTORE_PASSWORD が見つかりません"
            exit 1
          fi
          printf "%s" "$KS" | tr -d " \r\n" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: アプリの組み立て
        if: steps.v.outputs.skip != '1'
        working-directory: android
        env:
          PHONEPAD_KEYSTORE: ${{ runner.temp }}/release.jks
          PHONEPAD_KEYSTORE_PASSWORD: ${{ secrets.PHONEPAD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pvn=${{ steps.v.outputs.ver }} -Pvc=${{ steps.v.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk ../out/PhonePad.apk

      - name: PC用のzipを作る
        if: steps.v.outputs.skip != '1'
        run: |
          mkdir -p pkg/PhonePad
          cp out/PhonePad.exe out/PhonePad.apk pkg/PhonePad/
          cp -r pc/bundle/. pkg/PhonePad/
          (cd pkg && zip -r "../out/PhonePad-PC-v${{ steps.v.outputs.ver }}.zip" PhonePad)

      - name: 公開
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/notes.py "${{ steps.v.outputs.ver }}" > notes.md
          gh release create "v${{ steps.v.outputs.ver }}" --target "$GITHUB_SHA" \
            out/PhonePad.apk out/PhonePad.exe "out/PhonePad-PC-v${{ steps.v.outputs.ver }}.zip" \
            --title "PhonePad v${{ steps.v.outputs.ver }}" --notes-file notes.md
